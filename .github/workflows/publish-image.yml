name: Publish image

# 安定版タグ（vX.Y.Z）の push で GHCR へイメージを公開する。
#
# 公開するのは「スキャンとガードを通過したイメージそのもの」だけ:
#   1. gitleaks で全履歴をスキャン
#   2. アーキテクチャごとに 1 回ビルドし、そのイメージを Trivy とファイル検査にかける
#   3. 全て通った後に限り、同じ job の中で同じビルド（キャッシュ 100% ヒット）を
#      タグ無し・digest 指定で push し、config digest がスキャン対象と一致することを確認
#   4. publish ジョブは再ビルドせず、各アーキテクチャの digest から manifest list を作ってタグ付けするだけ
# 検査に失敗した時点で後続ステップは実行されないため、その arch のイメージは push されない。
# PR では検証（スキャンまで）だけを行い、ログインも push もしない。
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/shinkolab/news-summarizer
  # gitleaks v8.30.1 (multi-arch index digest)
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_VERSION: v0.76.1

jobs:
  gitleaks:
    name: Scan git history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks over the full history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" \
            git --redact --verbose --exit-code 1 /repo

  scan:
    name: Build, scan and push by digest (${{ matrix.platform }})
    needs: gitleaks
    runs-on: ${{ matrix.runner }}
    # packages: write はタグ push 時の「スキャン済みイメージの digest push」にだけ使う。
    # PR / workflow_dispatch ではログインしないのでトークンは使われない
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          # ネイティブ arm64 ランナー（public リポジトリでは無料）
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # リリース時は main との祖先関係を確認するため全履歴が要る。
          # `cond && 0 || 1` は 0 が falsy で常に 1 になるため、条件分岐させず常に全履歴を取る
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main (before any push)
        if: env.IS_RELEASE == 'true'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main; refusing to publish"
            exit 1
          fi
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image for scanning
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: scan-target:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=News Summarizer: LLM-based news summarization pipeline (Cloud Run Job image)
            org.opencontainers.image.licenses=ISC
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Trivy secret scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: scan-target:ci
          scanners: secret
          format: table
          exit-code: "1"
      - name: Trivy vulnerability scan (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: scan-target:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-vuln.txt
          exit-code: "0"
      - name: Show vulnerability report
        if: always()
        run: |
          {
            echo "### Trivy vulnerability report: ${{ matrix.platform }} (CRITICAL,HIGH / fixed only / non-blocking)"
            echo '```'
            # step summary は 1 MiB 上限。超えても公開を止めないよう切り詰める
            head -c 60000 trivy-vuln.txt 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Guard - forbidden files in image
        run: |
          set -euo pipefail
          cid=$(docker create scan-target:ci)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker export "$cid" | tar -t > image-files.txt
          echo "files in image: $(wc -l < image-files.txt)"
          # 依存物 (site-packages / node_modules)、OS の証明書ストア、uv の依存キャッシュは対象外
          hits=$(grep -vE '(^|/)(node_modules|site-packages)/|^(etc/ssl|usr/share/ca-certificates|usr/lib/ssl|root/\.cache/uv)/' image-files.txt \
            | grep -E '(^|/)\.env(\..*)?/?$|(^|/)config\.yaml$|\.db$|\.sqlite[^/]*$|\.pem$|\.key$|(^|/)\.git(/|$)|terraform\.tfstate|\.tfvars$' \
            | grep -vE '(^|/)\.env\.(example|local\.example)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::forbidden files found in image:"
            echo "$hits"
            exit 1
          fi
          echo "guard passed: no forbidden files"
      - name: Scanned image identity
        env:
          BUILD_META: ${{ steps.build.outputs.metadata }}
        run: |
          echo "scanned image id:         $(docker inspect --format '{{.Id}}' scan-target:ci)"
          echo "scanned config digest:    $(jq -r '."containerimage.config.digest" // "n/a"' <<< "$BUILD_META")"
          echo "scanned manifest digest:  $(jq -r '."containerimage.digest" // "n/a"' <<< "$BUILD_META")"
      # ---- ここから先は検査が全て通った場合のタグ push 時だけ ----
      - name: Log in to GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image by digest (no tag)
        id: push
        if: env.IS_RELEASE == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=News Summarizer: LLM-based news summarization pipeline (Cloud Run Job image)
            org.opencontainers.image.licenses=ISC
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Verify the pushed image is the scanned image
        if: env.IS_RELEASE == 'true'
        env:
          BUILD_META: ${{ steps.build.outputs.metadata }}
          PUSH_META: ${{ steps.push.outputs.metadata }}
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          scanned_id=$(docker inspect --format '{{.Id}}' scan-target:ci)
          scanned_config=$(jq -r '."containerimage.config.digest" // ""' <<< "$BUILD_META")
          scanned_manifest=$(jq -r '."containerimage.digest" // ""' <<< "$BUILD_META")
          pushed_config=$(jq -r '."containerimage.config.digest" // ""' <<< "$PUSH_META")
          echo "scanned: id=$scanned_id config=$scanned_config manifest=$scanned_manifest"
          echo "pushed:  config=$pushed_config manifest=$PUSH_DIGEST"
          # ローカルの image id（クラシックストアでは config digest）か、ビルドのメタデータの
          # config / manifest digest のどれかが push 結果と一致することを要求する
          ok=false
          [ -n "$pushed_config" ] && [ "$pushed_config" = "$scanned_id" ] && ok=true
          [ -n "$pushed_config" ] && [ "$pushed_config" = "$scanned_config" ] && ok=true
          [ -n "$scanned_manifest" ] && [ "$PUSH_DIGEST" = "$scanned_manifest" ] && ok=true
          if [ "$ok" != true ]; then
            echo "::error::pushed image differs from the scanned image"
            exit 1
          fi
          echo "verified: pushed image is the scanned image"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${PUSH_DIGEST#sha256:}"
      - name: Upload digest
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest list to GHCR
    needs: [gitleaks, scan]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main; refusing to publish"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Create manifest list from the scanned digests (no rebuild)
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*)
          test "${#files[@]}" -eq 2
          tag_args=()
          while read -r t; do tag_args+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          srcs=()
          for d in "${files[@]}"; do srcs+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${tag_args[@]}" "${srcs[@]}"
      - name: Inspect published image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
