name: Test stacked pull requests

# Main-targeting PRs already run these tests in publish-image.yml.
# Stacked PRs need tests only: no package writes, image publishing or secrets.
on:
  pull_request:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Run pytest (stacked PR, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run the full suite with frozen dependencies
        run: |
          docker run --rm -v "$PWD:/app" -w /app \
            -e UV_PROJECT_ENVIRONMENT=/tmp/test-venv \
            ghcr.io/astral-sh/uv:0.11.29-python3.12-trixie-slim \
            uv run --frozen pytest -q
