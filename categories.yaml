# カテゴリ分類の定義。要約プロンプトに注入され、ダイジェストの表示順もこの順序に従う。
categories:
  - name: AI・機械学習
    description: >
      生成AI・LLM、機械学習・深層学習、AIモデル／研究／製品、
      AIの技術・応用・倫理（技術が主眼のもの）。
  - name: テクノロジー
    description: >
      IT・ソフトウェア・ハードウェア、ガジェット・製品、通信、半導体、
      セキュリティ、クラウド／Web。※AI・機械学習が主題のものはここに入れない。
  - name: 経済・ビジネス
    description: >
      景気・金融政策・為替、企業動向・決算・M&A、業界動向、
      株式・債券・商品などの市況／マーケット。
  - name: 政治・社会
    description: >
      政治・選挙・政策・外交・国際政治、行政・法律・司法、社会問題・労働、
      教育制度・教育政策。戦争・紛争・軍事行動とその被害もここに含める。
      「国際」「中東」などの地域は軸にせず、記事の内容で判断する。
  - name: 事件・事故・災害
    description: >
      地震・台風・洪水・土砂災害・山火事などの自然災害、航空・鉄道・交通事故、
      火災・爆発・産業事故、殺人・強盗などの犯罪・テロ、避難・救助・被害状況。
      発生と被害そのものを伝える記事が対象。
  - name: 科学・環境
    description: >
      基礎科学・研究、宇宙・物理・生物・化学、気候変動・環境問題、
      エネルギー・自然。
  - name: 健康・ライフ
    description: >
      医療・健康・疾病・公衆衛生、食・栄養、フィットネス、メンタル、
      生活術、家族・育児、旅行・グルメ。
  - name: カルチャー
    description: >
      スポーツ、エンタメ（映画・音楽・TV・芸能）、アート・文化、
      ゲーム・ホビー、ネットの話題・バズ。

principles:
  - 見出しと第1段落が「何について書かれているか（記事の主眼）」で判断する。
  - 複数該当する場合は、下のタイブレーク規則を優先する。

tiebreak_rules:
  - "AI・機械学習 vs テクノロジー: モデル・学習・AI応用が主眼なら AI・機械学習。半導体・製品・インフラなど一般技術が主眼なら テクノロジー。"
  - "企業の決算・株価・資金調達・M&A が主眼 → 業種を問わず 経済・ビジネス（例: AI企業の決算 → 経済・ビジネス）。"
  - "政策・規制・国際交渉が主眼 → 政治・社会（例: AI規制の立法 → 政治・社会、気候政策 → 政治・社会）。技術・科学の中身が主眼なら AI・機械学習／科学・環境。"
  - "医療・健康: 制度・政策の話は 政治・社会、疾病・治療・健康法の中身は 健康・ライフ。"
  - "スポーツ選手・エンタメ作品の話は原則 カルチャー。明確に企業経営が主眼なら 経済・ビジネス。"
  - "事件・事故・災害 vs 政治・社会: 発生・被害・避難・救助が主眼なら 事件・事故・災害。制度・防災政策・責任追及・裁判・判決が主眼なら 政治・社会（例: 山火事の被害状況 → 事件・事故・災害、山火事を受けた政府の責任調査 → 政治・社会）。"
  - "戦争・紛争・軍事行動による死傷や破壊は 政治・社会。事件・事故・災害には入れない（例: ガザの被害報道、軍の越境攻撃 → 政治・社会）。"
  - "教育: 制度・入試改革・教育政策は 政治・社会。受験準備や進学の実務など読者向けの生活情報は 健康・ライフ。"

# LLM が定義外カテゴリを返し続けた場合のフォールバック（意図的に categories 外の値）
fallback: 未分類
