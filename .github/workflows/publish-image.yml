name: Publish image

# v* タグの push で GHCR へイメージを公開する。
# 公開は「履歴の秘密情報スキャン」「イメージのスキャンとファイル検査」を全て通過した後だけ。
# PR では検証（スキャンまで）だけを行い、ログインも push もしない。
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/shinkolab/news-summarizer
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TRIVY_VERSION: v0.76.1

jobs:
  gitleaks:
    name: Scan git history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks over the full history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git --redact --verbose --exit-code 1 /repo

  scan:
    name: Build and scan image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image for scanning
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-target:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      - name: Trivy secret scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: scan-target:ci
          scanners: secret
          format: table
          exit-code: "1"
      - name: Trivy vulnerability scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: scan-target:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-vuln.txt
          exit-code: "0"
      - name: Show vulnerability report
        if: always()
        run: |
          {
            echo '### Trivy vulnerability report (CRITICAL,HIGH / fixed only / non-blocking)'
            echo '```'
            cat trivy-vuln.txt 2>/dev/null || echo 'no report'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guard - forbidden files in image
        run: |
          set -euo pipefail
          cid=$(docker create scan-target:ci)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker export "$cid" | tar -t > image-files.txt
          echo "files in image: $(wc -l < image-files.txt)"
          # 依存物 (site-packages / node_modules) と OS 提供の証明書ストアは対象外
          hits=$(grep -vE '(^|/)(node_modules|site-packages)/|^(etc/ssl|usr/share/ca-certificates|usr/lib/ssl|root/\.cache/uv)/' image-files.txt \
            | grep -E '(^|/)\.env(\..*)?/?$|(^|/)config\.yaml$|\.db$|\.sqlite[^/]*$|\.pem$|\.key$|(^|/)\.git(/|$)|terraform\.tfstate|\.tfvars$' \
            | grep -vE '(^|/)\.env\.(example|local\.example)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::forbidden files found in image:"
            echo "$hits"
            exit 1
          fi
          echo "guard passed: no forbidden files"

  publish:
    name: Publish to GHCR (multi-arch)
    needs: [gitleaks, scan]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=News Summarizer: LLM-based news summarization pipeline (Cloud Run Job image)
            org.opencontainers.image.licenses=ISC
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,scope=multiarch,mode=max
