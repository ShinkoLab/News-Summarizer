# このファイルは「Summarizer + Viewer」だけを定義する。同梱の Miniflux（miniflux-db /
# miniflux）は compose.miniflux.yml にあり、.env の COMPOSE_FILE で一緒に読み込む:
#   COMPOSE_FILE=docker-compose.yml:compose.miniflux.yml   # 同梱 Miniflux（既定）
#   COMPOSE_FILE=docker-compose.yml                        # 手元の既存 Miniflux に接続
# 分けてあるのは、使わないサービスへの depends_on / profiles がエラーや強制起動に
# ならないようにするため（compose.miniflux.yml が summarizer の depends_on を足す）。

# summarizer / summarizer-once 共通の環境変数
x-summarizer-environment: &summarizer-environment
    DATABASE_BACKEND: sqlite
    SQLITE_DATABASE_PATH: /data/news_summarizer.db
    # 空なら entrypoint.sh が既定（同梱 Miniflux の http://miniflux:8080）を使う。
    # main.py へは API キーが確定した場合にだけ export する（config.py は MINIFLUX_* が
    # 1つでもあると api_key 欠落で起動時に落ちるため、メールのみの実行を壊さない）。
    # 既存の Miniflux に接続する場合は .env でこの2つを設定する。
    MINIFLUX_BASE_URL: ${MINIFLUX_BASE_URL:-}
    MINIFLUX_API_KEY: ${MINIFLUX_API_KEY:-}
    # 空 = 同梱 Miniflux なら true、既存 Miniflux なら false（compose.miniflux.yml 参照）
    MINIFLUX_IMPORT_STARTER_FEEDS: ${MINIFLUX_IMPORT_STARTER_FEEDS:-}
    LLM_PROVIDER: ${LLM_PROVIDER:-openai}
    LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-ollama}
    LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-true}
    LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
    LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
    LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    GROUPER_USE_EMBEDDINGS: ${GROUPER_USE_EMBEDDINGS:-false}
    # config.py の _apply_environment_overrides() に対応する環境変数。MAX_ARTICLES_PER_RUN と
    # MINIFLUX_FETCH_LIMIT は対で、小さい方が効く（AGENTS.md 参照）。お試し向けに少なめ
    # （20 / 25）を既定にしている。1 回の実行で記事ごとに LLM を呼ぶので、有料 API では
    # 件数がそのまま費用になる。
    MAX_ARTICLES_PER_RUN: ${MAX_ARTICLES_PER_RUN:-20}
    MINIFLUX_FETCH_LIMIT: ${MINIFLUX_FETCH_LIMIT:-25}
    MINIFLUX_STRIP_HTML: ${MINIFLUX_STRIP_HTML:-true}
    # メールソース（POP3）。EMAIL_HOST / USERNAME / PASSWORD が揃ったときだけ有効。
    EMAIL_HOST: ${EMAIL_HOST:-}
    EMAIL_USERNAME: ${EMAIL_USERNAME:-}
    EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    EMAIL_PORT: ${EMAIL_PORT:-}
    EMAIL_USE_SSL: ${EMAIL_USE_SSL:-true}
    EMAIL_MAX_FETCH_ATTEMPTS: ${EMAIL_MAX_FETCH_ATTEMPTS:-}
    EMAIL_DELETE_AFTER_PROCESSING: ${EMAIL_DELETE_AFTER_PROCESSING:-false}
    DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    NEWS_SUMMARIZER_SOURCE: ${NEWS_SUMMARIZER_SOURCE:-all}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    TZ: ${TZ:-Asia/Tokyo}

services:
  summarizer:
    # summarizer-once と同じイメージ名にして、--build で再ビルドされたものを両方が使う
    image: news-summarizer:local
    build:
      context: .
    environment:
      <<: *summarizer-environment
      NEWS_SUMMARIZER_INTERVAL_SECONDS: ${NEWS_SUMMARIZER_INTERVAL_SECONDS:-10800}
    volumes:
      - summarizer-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["run-loop"]
    restart: unless-stopped

  summarizer-once:
    profiles: ["manual"]
    image: news-summarizer:local
    build:
      context: .
    environment:
      <<: *summarizer-environment
    volumes:
      - summarizer-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["run-once"]

  web:
    build:
      # News-Viewer は別リポジトリ。Compose が URL から直接ビルドするので clone は不要。
      # Viewer 側を手元で開発しているときは NEWS_VIEWER_CONTEXT=../News-Viewer で差し替える。
      context: ${NEWS_VIEWER_CONTEXT:-https://github.com/ShinkoLab/News-Viewer.git#v1.5.2}
    depends_on:
      - summarizer
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEWS_VIEWER_PORT:-3080}:3000"
    environment:
      DB_BACKEND: sqlite
      # カテゴリの既定の表示順（カンマ区切り）。真の出所は categories.yaml の定義順で、
      # 本番は infra/main.tf が categories.yaml から注入する。並べ替えたらここも合わせる。
      CATEGORY_ORDER: ${CATEGORY_ORDER:-AI・機械学習,テクノロジー,経済・ビジネス,政治・社会,事件・事故・災害,科学・環境,健康・ライフ,カルチャー}
      DATABASE_URL: file:/data/news_summarizer.db
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - summarizer-data:/data:ro
    restart: unless-stopped

volumes:
  summarizer-data:
